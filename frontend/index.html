<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业知识库 RAG 系统</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #4f46e5;
    --primary-dark: #4338ca;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2937;
    --text-light: #6b7280;
    --border: #e5e7eb;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 20px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
  .user-box { display: flex; align-items: center; gap: 12px; }
  .username { font-size: 14px; font-weight: 500; }
  .logout-btn {
    background: rgba(255,255,255,0.15);
    color: white;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.28); }
  /* ===== 登录/注册视图 ===== */
  .login-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 36px;
    width: 360px;
    max-width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h2 { font-size: 20px; text-align: center; }
  .login-sub { color: var(--text-light); font-size: 13px; text-align: center; margin-top: -6px; }
  .login-card input {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }
  .login-card input:focus { border-color: var(--primary); }
  .login-actions { display: flex; gap: 10px; }
  .login-actions .btn { flex: 1; }
  #registerBtn { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  #registerBtn:hover { background: #f5f6ff; }
  .login-error { color: #ef4444; font-size: 13px; text-align: center; min-height: 18px; }
  #appView { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .body { flex: 1; display: flex; min-height: 0; }
  /* ===== 左侧会话列表 ===== */
  .sidebar {
    width: 260px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .sidebar-head { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sidebar-head .btn { width: 100%; }
  .conv-list { flex: 1; overflow-y: auto; padding: 8px; }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .conv-item:hover { background: #f3f4f6; }
  .conv-item.active { background: #eef2ff; }
  .conv-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv-del {
    border: none; background: none; color: var(--text-light);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 0 4px;
    visibility: hidden;
  }
  .conv-item:hover .conv-del { visibility: visible; }
  .conv-del:hover { color: #ef4444; }
  .conv-empty { color: var(--text-light); text-align: center; font-size: 13px; padding: 24px 0; }
  /* ===== 右侧主区 ===== */
  .container { flex: 1; display: flex; flex-direction: column; padding: 18px; gap: 14px; min-height: 0; }
  .upload-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .upload-card label { font-size: 14px; font-weight: 500; white-space: nowrap; }
  .upload-card input[type="file"] { font-size: 13px; flex: 1; min-width: 180px; }
  .btn {
    background: var(--primary); color: white; border: none; padding: 9px 18px;
    border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.15s; white-space: nowrap;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  #uploadStatus { font-size: 13px; color: var(--text-light); width: 100%; }
  .chat {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; display: flex; flex-direction: column; gap: 5px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 11px 15px; border-radius: 12px; font-size: 15px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: #f9fafb; border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .rewrite-hint { font-size: 12px; color: #9ca3af; font-style: italic; }
  .search-badge {
    display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: #f3f4f6; color: var(--text-light);
  }
  .search-badge.searched { background: #eef2ff; color: var(--primary); }
  .cite {
    font-size: 11px; color: var(--primary); background: #eef2ff; border-radius: 4px;
    padding: 1px 5px; cursor: pointer; vertical-align: super; font-weight: 600; margin: 0 1px;
  }
  .cite:hover { background: #c7d2fe; }
  .sources { display: flex; flex-direction: column; gap: 8px; }
  .source-card {
    background: #f9fafb; border: 1px solid var(--border); border-left: 3px solid var(--primary);
    border-radius: 8px; padding: 9px 12px; font-size: 13px;
  }
  .source-card .src-head { font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .source-card .src-snippet { color: var(--text-light); line-height: 1.6; }
  .input-bar { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); align-items: flex-end; }
  .input-bar textarea {
    flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px;
    font-size: 14px; resize: none; font-family: inherit; outline: none; max-height: 120px;
  }
  .input-bar textarea:focus { border-color: var(--primary); }
  .empty-hint { color: var(--text-light); text-align: center; font-size: 14px; margin-top: 20px; line-height: 1.7; }
</style>
</head>
<body>
<!-- 登录/注册视图 -->
<div id="loginView" class="login-view" style="display:none">
  <div class="login-card">
    <h2>📚 企业知识库 RAG 系统</h2>
    <p class="login-sub">登录后开始使用（没账号就注册一个）</p>
    <input id="loginUsername" placeholder="用户名">
    <input id="loginPassword" type="password" placeholder="密码">
    <div class="login-actions">
      <button class="btn" id="loginBtn" onclick="doLogin()">登录</button>
      <button class="btn" id="registerBtn" onclick="doRegister()">注册</button>
    </div>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 主应用视图（登录后可见） -->
<div id="appView" style="display:none">
  <header>
    <div>
      <h1>📚 企业知识库 RAG 系统</h1>
      <p>上传企业文档，用自然语言提问，AI 基于文档内容回答（多轮对话、历史持久化）</p>
    </div>
    <div class="user-box">
      <span class="username" id="usernameLabel"></span>
      <button class="logout-btn" onclick="doLogout()">退出登录</button>
    </div>
  </header>

  <div class="body">
    <aside class="sidebar">
      <div class="sidebar-head">
        <button class="btn" onclick="newConversation()">＋ 新建对话</button>
      </div>
      <div class="conv-list" id="conversationList">
        <div class="conv-empty">加载中...</div>
      </div>
    </aside>

    <div class="container">
      <div class="upload-card">
        <label>📄 上传文档：</label>
        <input type="file" id="file" accept=".txt,.md,.pdf,.docx">
        <button class="btn" id="uploadBtn" onclick="uploadFile()">上传并索引</button>
        <div id="uploadStatus">支持 txt / md / pdf / docx 格式</div>
      </div>

      <div class="chat">
        <div id="messages">
          <div class="empty-hint">👋 你好！我已经加载了示例文档（员工手册、IT 规范）。<br>可以直接提问，比如「报销超过5000元需要谁审批？」<br>也支持追问，比如先问「晋升条件」，再问「那报销呢？」</div>
        </div>
        <div class="input-bar">
          <textarea id="question" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="btn" id="sendBtn" onclick="sendMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ============ 登录状态 ============
  let token = localStorage.getItem('token');
  let username = localStorage.getItem('username');
  // 当前会话 ID（null 表示还没开始，或刚点了「新建对话」）
  let currentConversationId = null;

  // ============ 认证相关 ============
  function showLogin() {
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('appView').style.display = 'none';
  }
  function showApp() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('appView').style.display = 'flex';
    document.getElementById('usernameLabel').textContent = username;
    clearMessages();  // 清空聊天区，避免残留上一个用户的内容
    loadConversations();
  }
  function showLoginError(msg) {
    document.getElementById('loginError').textContent = msg;
  }
  async function doLogin() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (!u || !p) { showLoginError('请输入用户名和密码'); return; }
    const resp = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await resp.json();
    if (resp.ok) {
      token = data.token;
      username = data.username;
      localStorage.setItem('token', token);
      localStorage.setItem('username', username);
      showLoginError('');
      document.getElementById('loginPassword').value = '';
      showApp();
    } else {
      showLoginError(data.detail || '登录失败');
    }
  }
  async function doRegister() {
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (!u || !p) { showLoginError('请输入用户名和密码'); return; }
    const resp = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await resp.json();
    if (resp.ok) {
      token = data.token;
      username = data.username;
      localStorage.setItem('token', token);
      localStorage.setItem('username', username);
      showLoginError('');
      document.getElementById('loginPassword').value = '';
      showApp();
    } else {
      showLoginError(data.detail || '注册失败');
    }
  }
  function doLogout() {
    token = null;
    username = null;
    currentConversationId = null;
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    clearMessages();  // 清空聊天区，退出时也清
    showLogin();
  }

  // 统一的请求封装：自动带上登录 token，遇到 401 就退回登录页
  async function fetchWithAuth(url, options = {}) {
    const headers = { ...(options.headers || {}) };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const resp = await fetch(url, { ...options, headers });
    if (resp.status === 401) {
      doLogout();
      throw new Error('登录已过期');
    }
    return resp;
  }

  // ============ 工具函数 ============
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function getCitedIds(text) {
    const ids = new Set();
    const matches = text.match(/\[(\d+)\]/g);
    if (matches) {
      matches.forEach(m => ids.add(parseInt(m.replace(/[\[\]]/g, ''), 10)));
    }
    return ids;
  }
  function renderAnswer(text) {
    let html = escapeHtml(text);
    html = html.replace(/\[(\d+)\]/g, '<sup class="cite" data-id="$1">[$1]</sup>');
    return html;
  }
  function renderSources(sources) {
    const srcDiv = document.createElement('div');
    srcDiv.className = 'sources';
    sources.forEach(s => {
      const card = document.createElement('div');
      card.className = 'source-card';
      card.id = 'cite-' + s.id;
      const head = document.createElement('div');
      head.className = 'src-head';
      head.textContent = '[' + s.id + '] ' + s.source;
      const snippet = document.createElement('div');
      snippet.className = 'src-snippet';
      snippet.textContent = s.snippet;
      card.appendChild(head);
      card.appendChild(snippet);
      srcDiv.appendChild(card);
    });
    return srcDiv;
  }
  function bindCitations(msg) {
    msg.querySelectorAll('.cite').forEach(el => {
      el.addEventListener('click', function() {
        const card = document.getElementById('cite-' + this.dataset.id);
        if (card) {
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          card.style.background = '#eef2ff';
          setTimeout(() => card.style.background = '', 1600);
        }
      });
    });
  }
  function addMessage(role, text, sources, rewrittenQuery) {
    const container = document.getElementById('messages');
    const hint = container.querySelector('.empty-hint');
    if (hint) hint.remove();

    const msg = document.createElement('div');
    msg.className = 'msg ' + role;

    if (rewrittenQuery) {
      const hintEl = document.createElement('div');
      hintEl.className = 'rewrite-hint';
      hintEl.textContent = '🔍 已理解你的问题为：' + rewrittenQuery;
      msg.appendChild(hintEl);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (role === 'assistant') {
      bubble.innerHTML = renderAnswer(text);
    } else {
      bubble.textContent = text;
    }
    msg.appendChild(bubble);

    if (role === 'assistant' && sources && sources.length) {
      const citedIds = getCitedIds(text);
      const citedSources = sources.filter(s => citedIds.has(s.id));
      if (citedSources.length) {
        msg.appendChild(renderSources(citedSources));
      }
    }

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;

    if (role === 'assistant') {
      bindCitations(msg);
    }
  }
  function clearMessages() {
    const container = document.getElementById('messages');
    container.innerHTML = '<div class="empty-hint">👋 开始新的对话吧，可以提问任何公司制度相关的问题。</div>';
  }

  // ============ 会话列表管理 ============
  async function loadConversations() {
    try {
      const resp = await fetchWithAuth('/api/conversations');
      const convs = await resp.json();
      const list = document.getElementById('conversationList');
      list.innerHTML = '';

      if (!convs.length) {
        list.innerHTML = '<div class="conv-empty">暂无历史对话</div>';
        return;
      }

      convs.forEach(c => {
        const item = document.createElement('div');
        item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');

        const title = document.createElement('span');
        title.className = 'conv-title';
        title.textContent = c.title || '新对话';
        title.onclick = () => switchConversation(c.id);

        const del = document.createElement('button');
        del.className = 'conv-del';
        del.textContent = '×';
        del.title = '删除会话';
        del.onclick = (e) => { e.stopPropagation(); deleteConversation(c.id); };

        item.appendChild(title);
        item.appendChild(del);
        list.appendChild(item);
      });
    } catch (e) {
      // 401 已由 fetchWithAuth 处理（退回登录），这里静默
    }
  }

  async function switchConversation(id) {
    currentConversationId = id;
    clearMessages();
    try {
      const resp = await fetchWithAuth('/api/conversations/' + id + '/messages');
      const msgs = await resp.json();
      msgs.forEach(m => {
        if (m.role === 'assistant') {
          addMessage('assistant', m.content, m.sources);
        } else {
          addMessage('user', m.content);
        }
      });
      loadConversations(); // 刷新高亮
    } catch (e) {
      // 401 已处理
    }
  }

  function newConversation() {
    currentConversationId = null;
    clearMessages();
    loadConversations();
  }

  async function deleteConversation(id) {
    if (!confirm('确定删除这个会话吗？')) return;
    try {
      await fetchWithAuth('/api/conversations/' + id, { method: 'DELETE' });
      if (id === currentConversationId) {
        currentConversationId = null;
        clearMessages();
      }
      loadConversations();
    } catch (e) {
      // 401 已处理
    }
  }

  // ============ 发送消息（流式） ============
  async function sendMessage() {
    const input = document.getElementById('question');
    const question = input.value.trim();
    if (!question) return;

    addMessage('user', question);
    input.value = '';

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;
    btn.textContent = '思考中...';

    const container = document.getElementById('messages');
    const emptyHint = container.querySelector('.empty-hint');
    if (emptyHint) emptyHint.remove();
    const msg = document.createElement('div');
    msg.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    msg.appendChild(bubble);
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;

    let fullText = '';
    let meta = null;

    try {
      const resp = await fetchWithAuth('/api/rag/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, conversation_id: currentConversationId })
      });

      if (!resp.ok) {
        bubble.textContent = '请求失败：' + resp.status;
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          const obj = JSON.parse(line);
          if (obj.type === 'meta') {
            meta = obj;
            if (obj.conversation_id) currentConversationId = obj.conversation_id;
            const badge = document.createElement('div');
            badge.className = 'search-badge' + (obj.searched ? ' searched' : '');
            badge.textContent = obj.searched ? '🔎 检索知识库回答' : '💬 直接回答（未检索）';
            msg.insertBefore(badge, bubble);
            if (obj.rewritten_query && obj.rewritten_query !== question) {
              const hintEl = document.createElement('div');
              hintEl.className = 'rewrite-hint';
              hintEl.textContent = '🔍 已理解你的问题为：' + obj.rewritten_query;
              msg.insertBefore(hintEl, bubble);
            }
          } else if (obj.type === 'delta') {
            fullText += obj.data;
            bubble.textContent = fullText;
            container.scrollTop = container.scrollHeight;
          }
        }
      }

      bubble.innerHTML = renderAnswer(fullText);
      if (meta && meta.sources && meta.sources.length) {
        const citedIds = getCitedIds(fullText);
        const citedSources = meta.sources.filter(s => citedIds.has(s.id));
        if (citedSources.length) {
          msg.appendChild(renderSources(citedSources));
        }
      }
      bindCitations(msg);
      loadConversations();
    } catch (e) {
      if (e.message !== '登录已过期') {
        bubble.textContent = '网络错误：' + e.message;
      }
    } finally {
      btn.disabled = false;
      btn.textContent = '发送';
      input.focus();
    }
  }

  // ============ 上传文档 ============
  async function uploadFile() {
    const fileInput = document.getElementById('file');
    const file = fileInput.files[0];
    if (!file) {
      alert('请先选择一个文件');
      return;
    }
    const status = document.getElementById('uploadStatus');
    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;
    status.textContent = '上传并索引中，请稍候...';

    const formData = new FormData();
    formData.append('file', file);

    try {
      const resp = await fetchWithAuth('/api/documents/upload', {
        method: 'POST',
        body: formData
      });
      const data = await resp.json();
      if (resp.ok) {
        status.textContent = '✅ ' + data.message;
        fileInput.value = '';
      } else {
        status.textContent = '❌ ' + (data.detail || '上传失败');
      }
    } catch (e) {
      if (e.message !== '登录已过期') {
        status.textContent = '❌ 上传失败：' + e.message;
      }
    } finally {
      btn.disabled = false;
    }
  }

  // ============ 初始化 ============
  document.getElementById('question').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  // 登录框按 Enter 直接登录
  document.getElementById('loginPassword').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); doLogin(); }
  });

  // 有 token 就进主界面，否则显示登录页
  if (token) showApp(); else showLogin();
</script>
</body>
</html>
